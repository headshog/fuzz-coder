name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            sentence-transformers \
            transformers \
            torch \
            tqdm \
            python-magic \
            regex \
            requests \
            pytest \
            tree_sitter \
            tree_sitter_cpp \
            tree_sitter_java \
            faiss-cpu \
            numpy

      - name: Run tests
        run: python -m pytest -q tests -m "not e2e"

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            sentence-transformers \
            transformers \
            torch \
            tqdm \
            python-magic \
            regex \
            requests \
            pytest \
            tree_sitter \
            tree_sitter_cpp \
            tree_sitter_java \
            faiss-cpu \
            numpy

      - name: Run e2e tests
        env:
          RUN_LLAMA_CPP_E2E: "1"
        run: python -m pytest -q tests -m "e2e"
